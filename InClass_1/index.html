<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .section {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #ddd;
        }
        input[type="text"] {
            padding: 6px;
            width: 220px;
            margin-right: 5px;
        }
        button {
            padding: 6px 12px;
            cursor: pointer;
        }
        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .task-item.completed span {
            text-decoration: line-through;
            color: #888;
        }
        .error {
            color: red;
            font-size: 0.85rem;
            margin-top: 4px;
            display: none;
        }
        .stats {
            font-weight: bold;
            margin-top: 15px;
        }
        @media (max-width: 480px) {
            body {
                margin: 10px;
            }
            .container {
                padding: 10px;
            }
            input[type="text"] {
                width: 100%;
                margin-bottom: 8px;
                box-sizing: border-box;
            }
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Task Manager</h1>

        <div class="section">
            <form id="task-form" onsubmit="addTask(event)">
                <label for="task-input">新增任務：</label>
                <input type="text" id="task-input" placeholder="任務名稱">
                <button type="submit">新增</button>
                <div id="error-msg" class="error">請輸入任務名稱！</div>
            </form>
        </div>

        <div class="section">
            <span>篩選：</span>
            <button type="button" onclick="setFilter('all')" id="btn-all">全部</button>
            <button type="button" onclick="setFilter('active')" id="btn-active">未完成</button>
            <button type="button" onclick="setFilter('completed')" id="btn-completed">已完成</button>
        </div>
        <!-- 最重要的語意化 HTML 區域 -->
        <div class="section">
            <ul id="task-list" class="task-list">
            </ul>
        </div>

        <div id="task-stats" class="stats">
            共 0 項　未完成 0 項
        </div>
    </div>

    <script>
        let tasks = [
            { id: 1, text: '完成 Web App 實作', completed: false },
            { id: 2, text: '完成 JavaScript 練習', completed: false },
            { id: 3, text: '完成課程作業', completed: true }
        ];
        let currentFilter = 'all';

        function addTask(event) {
            event.preventDefault();
            const input = document.getElementById('task-input');
            const errorMsg = document.getElementById('error-msg');
            const text = input.value.trim();

            if (!text) {
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';

            const newTask = {
                id: Date.now(),
                text: text,
                completed: false
            };

            tasks.push(newTask);
            input.value = '';
            render();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            render();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            render();
        }

        function setFilter(filter) {
            currentFilter = filter;
            render();
        }

        function render() {
            const listEl = document.getElementById('task-list');
            const statsEl = document.getElementById('task-stats');

            // Filter tasks
            const filtered = tasks.filter(t => {
                if (currentFilter === 'active') return !t.completed;
                if (currentFilter === 'completed') return t.completed;
                return true;
            });

            // Calculate stats
            const total = tasks.length;
            const active = tasks.filter(t => !t.completed).length;
            statsEl.textContent = `共 ${total} 項　未完成 ${active} 項`;

            // Highlight active filter button
            document.getElementById('btn-all').style.fontWeight = currentFilter === 'all' ? 'bold' : 'normal';
            document.getElementById('btn-active').style.fontWeight = currentFilter === 'active' ? 'bold' : 'normal';
            document.getElementById('btn-completed').style.fontWeight = currentFilter === 'completed' ? 'bold' : 'normal';

            // Render list HTML
            if (filtered.length === 0) {
                listEl.innerHTML = '<li style="color: #888; padding: 5px 0;">目前無符合的任務</li>';
                return;
            }

            listEl.innerHTML = filtered.map(t => `
                <li class="task-item ${t.completed ? 'completed' : ''}">
                    <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id})">
                        <span>${escapeHtml(t.text)}</span>
                    </label>
                    <button type="button" onclick="deleteTask(${t.id})">刪除</button>
                </li>
            `).join('');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initial render on page load
        render();
    </script>
</body>
</html>
